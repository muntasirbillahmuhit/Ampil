<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A0A0A">
<title>VolumeTouch</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{height:100%}
  body{background:#0A0A0A;color:#fff;font-family:Inter,-apple-system,'SF Pro Display','Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none}
  /* wallpaper gives the glass something to refract */
  .wall{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:#0A0A0A}
  .wall i{position:absolute;border-radius:50%;filter:blur(60px)}
  .wall .a{width:380px;height:380px;background:#6d3bff;top:-90px;left:-120px;opacity:.75;animation:d1 22s ease-in-out infinite alternate}
  .wall .b{width:340px;height:340px;background:#ff3d8b;top:32%;right:-140px;opacity:.6;animation:d2 26s ease-in-out infinite alternate}
  .wall .c{width:360px;height:360px;background:#12c9d6;bottom:-120px;left:-60px;opacity:.55;animation:d1 30s ease-in-out infinite alternate-reverse}
  .wall .d{width:200px;height:200px;background:#ffb23d;top:58%;left:30%;opacity:.35;animation:d2 24s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(70px,90px) scale(1.15)}}
  @keyframes d2{to{transform:translate(-80px,-60px) scale(.9)}}

  .glass{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 55%,rgba(255,255,255,.12));-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -1.5px 1px rgba(255,255,255,.16),inset 1.5px 0 1px rgba(255,255,255,.22),inset -1px 0 1px rgba(255,255,255,.1),inset 0 0 24px rgba(255,255,255,.07),0 14px 40px -8px rgba(0,0,0,.45)}
  .glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 70% at 18% -10%,rgba(255,255,255,.38),transparent 55%)}
  .card{border-radius:32px;padding:16px 16px 18px}
  .orb{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none}
  .tint{background:linear-gradient(150deg,var(--hi),var(--lo));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(0,0,0,.25),0 6px 20px -4px var(--glow)}
  .iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
  .iconbtn:active{transform:scale(.85)}

  /* slider */
  .track{--p:0;position:relative;height:44px;margin-top:16px;touch-action:none;cursor:pointer}
  .rail{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:rgba(0,0,0,.28);box-shadow:inset 0 2px 6px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.14)}
  .fill{position:absolute;inset:0 auto 0 0;width:calc(var(--p)*(100% - 60px) + 30px);background:linear-gradient(90deg,var(--lo),var(--hi));box-shadow:0 0 24px var(--glow);transition:width .3s cubic-bezier(.2,.9,.3,1)}
  .thumb{position:absolute;top:50%;left:calc(var(--p)*(100% - 60px));width:60px;height:38px;margin-top:-19px;border-radius:19px;background:rgba(255,255,255,.34);-webkit-backdrop-filter:blur(3px) saturate(220%) brightness(1.15);backdrop-filter:blur(3px) saturate(220%) brightness(1.15);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -2px 3px rgba(255,255,255,.35),inset 0 0 12px rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.4);transition:left .3s cubic-bezier(.2,.9,.3,1),transform .35s cubic-bezier(.3,1.7,.5,1),background .2s}
  .track.drag .thumb{transform:scale(1.28,1.2);background:rgba(255,255,255,.18);transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
  .track.drag .fill{transition:none}
  .off .fill{box-shadow:none}
  .off .tint{filter:grayscale(1) brightness(.8);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5)}

  /* dock + buttons */
  .dock{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);margin-top:20px;border-radius:40px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:20}
  .seg{height:58px;border-radius:32px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;position:relative;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .3s,box-shadow .3s}
  .seg:active{transform:scale(.94)}
  #muteAll.on{background:linear-gradient(150deg,#ff6b78,#e0173f);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),0 8px 26px -4px rgba(255,59,90,.7)}
  #vibe.on{background:linear-gradient(150deg,#6aa9ff,#2f5cff);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),0 8px 26px -4px rgba(70,120,255,.7)}
  .seg .dot{width:9px;height:9px;border-radius:50%}
  #bubble{position:fixed;width:62px;height:62px;border-radius:50%;z-index:30;display:grid;place-items:center;touch-action:none;cursor:grab;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
  #bubble.drag{transform:scale(1.18);cursor:grabbing}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-90px);transition:transform .4s cubic-bezier(.3,1.5,.5,1);z-index:40;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
  #toast.show{transform:translate(-50%,0)}
  .wrap{padding-top:env(safe-area-inset-top,0px);padding-bottom:6px}
  :focus-visible{outline:2px solid #fff;outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wall"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
<div id="toast" class="glass" role="status" aria-live="polite"></div>

<main class="wrap relative mx-auto flex min-h-full w-full max-w-md flex-col px-4">
  <header class="flex items-center justify-between pb-5 pt-5">
    <div class="glass flex items-center gap-2.5 rounded-full py-1.5 pl-1.5 pr-5">
      <div class="orb tint !h-10 !w-10" style="--hi:#c9a6ff;--lo:#7b4dff;--glow:rgba(140,90,255,.7)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="#fff"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </div>
      <h1 class="text-[19px] font-bold tracking-tight">VolumeTouch</h1>
    </div>
    <button class="glass iconbtn !h-12 !w-12" aria-label="Settings" onclick="toast('Settings coming soon')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </header>

  <p id="status" class="px-2 pb-3 text-[15px] font-medium text-white/65">Drag a slider to set the volume</p>
  <section id="list" class="flex flex-col gap-3.5"></section>

  <nav class="dock glass" aria-label="Quick modes">
    <button id="muteAll" class="seg"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="#fff"/><path d="m22 9-6 6m0-6 6 6"/></svg><span id="muteAllLbl">Mute all</span></button>
    <button id="vibe" class="seg"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M3.5 8v8M20.5 8v8"/></svg>Vibrate mode</button>
  </nav>
</main>

<button id="bubble" class="glass" aria-label="Floating volume bubble"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="#fff"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>

<script>
const ic = p => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const CH = [
  {id:'media', name:'Media', v:70, hi:'#c9a6ff', lo:'#7b4dff', glow:'rgba(140,90,255,.65)', icon:ic('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3" fill="#fff"/><circle cx="18" cy="16" r="3" fill="#fff"/>')},
  {id:'ring', name:'Ring', v:55, hi:'#7df0c4', lo:'#10b981', glow:'rgba(30,215,155,.6)', icon:ic('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z" fill="#fff"/>')},
  {id:'alarm', name:'Alarm', v:85, hi:'#ffd36b', lo:'#ff8a1f', glow:'rgba(255,165,50,.6)', icon:ic('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3 2 6M22 6l-3-3"/>')},
  {id:'notif', name:'Notification', v:40, hi:'#ff9dbd', lo:'#f0386a', glow:'rgba(255,80,130,.6)', icon:ic('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" fill="#fff"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>')}
];
const spk = m => `<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="#fff"/>${m?'<path d="m22 9-6 6m0-6 6 6"/>':'<path d="M15.5 8.5a5 5 0 0 1 0 7"/>'}</svg>`;
const buzz = n => { try { navigator.vibrate && navigator.vibrate(n); } catch(e){} };
const $ = s => document.querySelector(s);
const clamp = (n,a,b) => Math.max(a,Math.min(b,n));
let tt;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1800); }

const S={}, P={};
CH.forEach(ch=>{
  S[ch.id]=ch.v; P[ch.id]=ch.v;
  const el=document.createElement('article');
  el.className='card glass';
  el.style.cssText=`--hi:${ch.hi};--lo:${ch.lo};--glow:${ch.glow}`;
  el.innerHTML=`
    <div class="relative flex items-center gap-3.5">
      <div class="orb tint">${ch.icon}</div>
      <div class="min-w-0 flex-1"><h2 class="text-[17px] font-semibold leading-tight">${ch.name}</h2><p data-sub class="text-[13px] text-white/60"></p></div>
      <div class="flex items-baseline"><span data-n class="text-[30px] font-bold tabular-nums leading-none tracking-tight">0</span><span class="ml-0.5 text-[15px] font-semibold text-white/60">%</span></div>
      <button class="glass iconbtn" data-m aria-label="Mute ${ch.name}"></button>
    </div>
    <div class="track" data-t role="slider" tabindex="0" aria-label="${ch.name} volume" aria-valuemin="0" aria-valuemax="100">
      <div class="rail"><div class="fill"></div></div><div class="thumb"></div>
    </div>`;
  $('#list').appendChild(el);
  const tr=el.querySelector('[data-t]'); let step=-1;
  ch.set=v=>{
    v=Math.round(clamp(v,0,100)); S[ch.id]=v;
    tr.style.setProperty('--p',v/100);
    el.querySelector('[data-n]').textContent=v;
    el.querySelector('[data-m]').innerHTML=spk(v===0);
    el.querySelector('[data-sub]').textContent=v===0?'Muted':v<34?'Low':v<67?'Medium':'Loud';
    el.classList.toggle('off',v===0);
    tr.setAttribute('aria-valuenow',v);
    if(v>0)P[ch.id]=v;
    sync();
  };
  const read=e=>{const r=tr.getBoundingClientRect();return ((e.clientX-r.left-30)/(r.width-60))*100;};
  const move=e=>{const v=Math.round(clamp(read(e),0,100));const s=Math.floor(v/5);if(s!==step){step=s;buzz(10);}if(v===0||v===100)buzz(10);ch.set(v);};
  tr.addEventListener('pointerdown',e=>{tr.setPointerCapture(e.pointerId);tr.classList.add('drag');step=-1;move(e);});
  tr.addEventListener('pointermove',e=>{if(tr.hasPointerCapture(e.pointerId))move(e);});
  ['pointerup','pointercancel'].forEach(t=>tr.addEventListener(t,()=>tr.classList.remove('drag')));
  tr.addEventListener('keydown',e=>{const d={ArrowRight:5,ArrowUp:5,ArrowLeft:-5,ArrowDown:-5}[e.key];if(d){e.preventDefault();buzz(10);ch.set(S[ch.id]+d);}});
  el.querySelector('[data-m]').addEventListener('click',()=>{
    buzz(20);
    if(S[ch.id]>0){P[ch.id]=S[ch.id];ch.set(0);toast(ch.name+' muted');}
    else{ch.set(P[ch.id]||50);toast(ch.name+' restored');}
  });
  ch.set(ch.v);
});

let vibeOn=false,saved={};
function sync(){
  const off=CH.filter(c=>S[c.id]===0).length, all=off===4;
  $('#muteAll').classList.toggle('on',all);
  $('#muteAllLbl').textContent=all?'Unmute all':'Mute all';
  $('#status').textContent=vibeOn?'Vibrate mode is on':all?'Everything is muted':off?`${off} of 4 muted`:'Drag a slider to set the volume';
  $('#bubble').style.opacity=S.media===0?.65:1;
}
$('#muteAll').addEventListener('click',()=>{
  const all=CH.every(c=>S[c.id]===0);buzz([20,40,20]);
  if(all){CH.forEach(c=>c.set(P[c.id]||50));toast('Sound restored');}
  else{CH.forEach(c=>{if(S[c.id]>0)P[c.id]=S[c.id];c.set(0);});toast('Everything muted');}
});
$('#vibe').addEventListener('click',()=>{
  vibeOn=!vibeOn;$('#vibe').classList.toggle('on',vibeOn);
  const t=['ring','notif'].map(id=>CH.find(c=>c.id===id));
  if(vibeOn){t.forEach(c=>{saved[c.id]=S[c.id]||P[c.id];c.set(0);});buzz([80,60,80]);toast('Vibrate mode on');}
  else{t.forEach(c=>c.set(saved[c.id]||50));buzz(20);toast('Vibrate mode off');}
  sync();
});

/* Floating bubble */
const B=$('#bubble');B.style.right='16px';B.style.bottom='calc(env(safe-area-inset-bottom,0px) + 110px)';
let bx,by,sx,sy,mv=false;
B.addEventListener('pointerdown',e=>{B.setPointerCapture(e.pointerId);B.classList.add('drag');const r=B.getBoundingClientRect();B.style.right=B.style.bottom='auto';B.style.left=r.left+'px';B.style.top=r.top+'px';bx=r.left;by=r.top;sx=e.clientX;sy=e.clientY;mv=false;});
B.addEventListener('pointermove',e=>{if(!B.hasPointerCapture(e.pointerId))return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>5)mv=true;B.style.left=clamp(bx+dx,6,innerWidth-68)+'px';B.style.top=clamp(by+dy,6,innerHeight-68)+'px';});
B.addEventListener('pointerup',()=>{B.classList.remove('drag');const r=B.getBoundingClientRect();B.style.transition='left .35s cubic-bezier(.3,1.4,.5,1),transform .25s cubic-bezier(.3,1.6,.5,1)';B.style.left=(r.left+31<innerWidth/2?12:innerWidth-74)+'px';setTimeout(()=>B.style.transition='',380);if(!mv){buzz(15);toast('Media volume '+S.media+'%');}else buzz(10);});
</script>
</body>
</html>
