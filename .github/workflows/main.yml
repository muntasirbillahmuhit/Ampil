name: Build APK - ampil

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Capacitor CLI & Core
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor for ampil
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "ampil" "com.ampil.app" --web-dir=dist
          fi

      - name: Add Android platform and inject Accessibility Service
        run: |
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap add android
          fi
          # Ensure custom native accessibility service files and manifest are placed correctly
          mkdir -p android/app/src/main/java/com/ampil/app
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values
          cp -f AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -f res/xml/accessibility_service_config.xml android/app/src/main/res/xml/accessibility_service_config.xml
          cp -rf res/values/* android/app/src/main/res/values/
          cp -f VolumeAccessibilityService.kt android/app/src/main/java/com/ampil/app/VolumeAccessibilityService.kt
          cp -f MainActivity.kt android/app/src/main/java/com/ampil/app/MainActivity.kt

      - name: Sync web assets
        run: npx cap sync android

      - name: Re-apply native overrides after sync
        run: |
          cp -f AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -f res/xml/accessibility_service_config.xml android/app/src/main/res/xml/accessibility_service_config.xml
          cp -rf res/values/* android/app/src/main/res/values/
          cp -f VolumeAccessibilityService.kt android/app/src/main/java/com/ampil/app/VolumeAccessibilityService.kt
          cp -f MainActivity.kt android/app/src/main/java/com/ampil/app/MainActivity.kt

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ampil-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
